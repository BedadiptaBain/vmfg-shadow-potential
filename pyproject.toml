[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmfg"
version = "1.0.0"
description = "Replication and verification code for 'Equilibrium premium dynamics in a variance-supply mean-field game: a shadow-potential reduction'"
authors = [{ name = "Bedadipta Bain" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "mpmath>=1.3", "pandas>=2.0", "matplotlib>=3.7", "openpyxl>=3.1", "requests>=2.28", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=7"]
yahoo = ["yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
